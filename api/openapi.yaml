          "expected_revision"
        ],
        "type": "object"
      },
      "UploadCreate": {
        "properties": {
          "filename": {
            "type": "string"
          },
          "sha256": {
            "pattern": "^[a-fA-F0-9]{64}$",
            "type": "string"
          },
          "total_bytes": {
            "format": "int64",
            "minimum": 1,
            "type": "integer"
          }
        },
        "required": [
          "filename",
          "total_bytes",
          "sha256"
        ],
        "title": "UploadCreate",
        "type": "object"
      },
      "UploadState": {
        "properties": {
          "expires_at": {
            "type": "string"
          },
          "id": {
            "format": "uuid",
            "type": "string"
          },
          "offset": {
            "format": "int64",
