[package]
name = "dagaz-windows"
version.workspace = true
edition.workspace = true

[features]
ui = ["dep:gpui-kit"]

[dependencies]
dagaz-protocol = { path = "../../crates/protocol" }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
gpui-kit = { version = "=0.10.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
axum = "=0.8.9"
tokio = { version = "1", features = ["macros", "net"] }

[[bin]]
name = "dagaz-windows"
path = "src/main.rs"
required-features = ["ui"]
