[package]
name = "dagaz-server"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "dagaz"
path = "src/main.rs"

[dependencies]
dagaz-protocol = { path = "../../crates/protocol" }
axum = "=0.8.9"
aws-sdk-s3 = "=1.160.0"
getrandom = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "=0.25.5"
fs2 = "0.4"
time = { version = "0.3", features = ["formatting"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
percent-encoding = "2"
sha2 = "0.10"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time", "fs", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tempfile = "3"
