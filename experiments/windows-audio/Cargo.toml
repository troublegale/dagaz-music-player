[package]
name = "dagaz-windows-audio-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
gpui-kit = { version = "=0.10.0", optional = true }
raw-window-handle = { version = "0.6", optional = true, features = ["std"] }
souvlaki = { version = "=0.9.3", default-features = false, optional = true }
rodio = { version = "=0.23.0", optional = true, default-features = false, features = ["playback", "wav", "mp3", "flac"] }
stream-download = { version = "=0.24.6", default-features = false, features = ["reqwest-rustls", "temp-storage"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[features]
ui = ["dep:gpui-kit", "dep:rodio", "dep:raw-window-handle", "dep:souvlaki"]

[dev-dependencies]
rodio = { version = "=0.23.0", default-features = false, features = ["wav", "mp3", "flac"] }
windows = { version = "0.62", features = ["Media_Control", "Foundation_Collections"] }

[[bin]]
name = "dagaz-windows-audio-probe"
required-features = ["ui"]
