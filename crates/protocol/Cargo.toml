[package]
name = "dagaz-protocol"
version.workspace = true
edition.workspace = true

[dependencies]
schemars = { version = "1.2.3", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
jsonschema = { version = "0.61.2", default-features = false }
